version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: oddspot-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: oddspot
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oddspot-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/oddspot
      JWT_SECRET: production-secret-minimum-32-chars-long-key-needed!
      FRONTEND_URL: http://localhost:5173,http://localhost:3000
      TRUST_PROXY: "1"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
