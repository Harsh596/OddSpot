name: Tests and Audit

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend-test:
    name: Backend Tests & Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run Integration Tests (node:test + supertest)
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-value-never-use-in-production-123456

      - name: Run End-to-End Smoke Tests
        run: npm run test:smoke
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-value-never-use-in-production-123456

  frontend-build:
    name: Frontend Build & Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run frontend production build
        run: npm run build
